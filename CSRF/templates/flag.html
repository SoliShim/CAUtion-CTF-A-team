{% extends "base.html" %}
{% block title %}Report · CoinTrade{% endblock %}
{% block content %}
<div class="card">
    <h1>관리자 리포트</h1>
    <p class="muted">파라미터를 전송하면 관리자가 해당 URL을 직접 확인합니다.</p>
    <form method="post" action="{{ url_for('flag') }}">
        <div class="form-group">
            <label for="param">파라미터</label>
            <input type="text" id="param" name="param" placeholder="관리자에게 전달할 값" required>
        </div>
        <button type="submit">전송하기</button>
    </form>
</div>
{% endblock %}
