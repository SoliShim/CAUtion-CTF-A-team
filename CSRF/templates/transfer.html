{% extends "base.html" %}
{% block title %}Transfer · CSRFBank{% endblock %}
{% block content %}
<div class="card">
    <h1>송금</h1>

    {% if text %}
    <div class="alert alert-error">{{ text }}</div>
    {% endif %}

    {% if current_user %}
    <p class="muted">돈이 많으신가요? 다른 사용자에게 선물해보세요</p>

    <form method="post" action="{{ url_for('transfer') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="to">받는 사용자</label>
            <input type="text" id="to" name="to" placeholder="사용자명" required>
        </div>
        <div class="form-group">
            <label for="amount">금액</label>
            <input type="number" id="amount" name="amount" min="1" placeholder="전송할 코인" required>
        </div>
        <button type="submit">송금하기</button>
    </form>
    {% endif %}
</div>
{% endblock %}
