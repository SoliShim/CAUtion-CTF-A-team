{% extends "base.html" %}
{% block title %}Transfer · CoinTrade{% endblock %}
{% block content %}
<div class="card">
    <h1>코인 전송</h1>
    <p class="muted">다른 사용자에게 보유한 코인을 전송할 수 있습니다.</p>
    <form method="post" action="{{ url_for('transfer') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="to">받는 사용자</label>
            <input type="text" id="to" name="to" placeholder="사용자명" required>
        </div>
        <div class="form-group">
            <label for="amount">금액</label>
            <input type="number" id="amount" name="amount" min="1" placeholder="전송할 코인" required>
        </div>
        <button type="submit">전송하기</button>
    </form>
</div>
{% endblock %}
