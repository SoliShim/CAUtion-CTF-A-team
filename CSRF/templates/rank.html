{% extends "base.html" %}
{% block title %}Rank · CSRFBank{% endblock %}
{% block content %}
<div class="card">
    <h1>랭킹</h1>
    <table>
        <thead>
            <tr>
                <th style="width:80px;">순위</th>
                <th>사용자명</th>
                <th class="text-right">보유 코인</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in ranking %}
            <tr>
                <td class="rank-num {% if entry.rank == 1 %}top-1{% elif entry.rank == 2 %}top-2{% elif entry.rank == 3 %}top-3{% endif %}">
                    #{{ entry.rank }}
                </td>
                <td>{{ entry.username }}</td>
                <td class="text-right">{{ "{:,}".format(entry.coin) }}원</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
