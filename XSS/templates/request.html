<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

  <title>개인정보 문의 작성</title>

</head>

<body>

  <div class="container">

    <span class="badge">REQUEST</span>

    <h1>개인정보 정정/삭제 문의</h1>

    <div class="notice">

      개인정보 정정, 삭제 및 열람 요청은
      내부 검토 절차를 거쳐 처리됩니다.

    </div>

    <div class="card">

      <form method="POST">

        <p>

          <label>
            <strong>제목</strong>
          </label>

          <br><br>

          <input type="text"
                 name="title"
                 placeholder="문의 제목 입력"
                 required>

        </p>

        <p>

          <label>
            <strong>문의 내용</strong>
          </label>

          <br><br>

          <textarea name="content"
                    rows="8"
                    placeholder="문의 내용을 입력하세요."
                    required></textarea>

        </p>

        <button type="submit">
          제출
        </button>

      </form>

    </div>

    <p>
      <a href="/">메인으로</a>
    </p>

  </div>

</body>
</html>
