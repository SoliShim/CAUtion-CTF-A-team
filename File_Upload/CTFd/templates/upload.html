<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 업로드</title>

    <link rel="stylesheet" href="/static/style.css">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>

<body class="dashboard-body">

<div class="upload-wrapper">

    <div class="upload-card">

        <div class="terminal-label">업로드</div>
        <h1>파일 업로드</h1>

        <p>
            정책에 맞는 이미지 파일만 업로드할 수 있습니다.
        </p>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <input type="file" name="file">

            </div>

            <button type="submit">
                업로드
            </button>

        </form>

    </div>

</div>

</body>
</html>
