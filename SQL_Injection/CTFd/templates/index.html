<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Portal</title>
    <style>
        body {
            background-color: #f4f7f6;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 350px;
        }
        .title-box {
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #2c3e50;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 0;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-top: 5px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            color: #2d3436;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #3498db;
            background-color: #ffffff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="title-box">
            <h2>Admin Portal</h2>
            <p class="subtitle">Secure Login</p>
            <p style="color: #e74c3c; font-weight: bold; margin-top: 15px; font-size: 15px;">[ SQL Injection Challenge ]</p>
        </div>
        <form method="POST" action="/">
            <label for="userid">ID</label>
            <input type="text" id="userid" name="userid" required autocomplete="off">
            
            <label for="userpassword">Password</label>
            <input type="password" id="userpassword" name="userpassword" required>
            
            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
