<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Flag</title>
    <style>
        body { background-color: #f4f7f6; color: #333; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #ffffff; padding: 40px 50px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); width: 350px; }
        .title-box { text-align: center; margin-bottom: 30px; }
        h2 { color: #9b59b6; font-weight: 600; letter-spacing: 1px; margin: 0; }
        p.subtitle { color: #7f8c8d; font-size: 14px; margin-top: 5px; }
        label { display: block; margin-bottom: 8px; color: #34495e; font-size: 14px; font-weight: 500; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; background-color: #f8f9fa; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        input[type="text"]:focus { outline: none; border-color: #9b59b6; background-color: #ffffff; }
        button { width: 100%; padding: 14px; background-color: #9b59b6; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #8e44ad; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="title-box">
            <h2>Flag Submission</h2>
            <p class="subtitle">Did you find the secret?</p>
        </div>
        <form method="POST" action="/flag">
            <label for="flag">Enter Flag</label>
            <input type="text" id="flag" name="flag" placeholder="FLAG_REMOVED_FOR_CTFD" required autocomplete="off">
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="/" style="color: #7f8c8d; text-decoration: none; font-size: 13px;">Back to Login</a>
        </div>
    </div>
</body>
</html>
