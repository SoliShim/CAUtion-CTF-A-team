<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Admin Challenge</title>
    <style>
        /* 전체 배경 및 폰트 설정 (터미널 느낌의 Monospace 폰트 적용) */
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 로그인 박스 디자인 */
        .login-container {
            background-color: #16213e;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #0f3460;
            width: 320px;
            text-align: center;
        }

        /* 통제 구역 경고 문구 (빨간색 포인트) */
        h1 {
            color: #e94560;
            font-size: 22px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* 입력 폼 정렬 및 디자인 */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #8fa1b3;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background-color: #0d1b2a;
            color: #00ffcc; /* 입력할 때 글씨는 네온 민트색 */
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border: 1px solid #e94560;
        }

        /* 로그인 버튼 디자인 */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            background-color: #e94560;
            color: white;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #c83b52;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>[ RESTRICTED AREA ]</h1>
        <form method="POST" action="/">
            <div class="input-group">
                <label for="userid">ID:</label>
                <input type="text" id="userid" name="userid" autocomplete="off" required>
            </div>
            <div class="input-group">
                <label for="userpassword">Password:</label>
                <input type="password" id="userpassword" name="userpassword" required>
            </div>
            <button type="submit">AUTHORIZE</button>
        </form>
    </div>

</body>
</html>
